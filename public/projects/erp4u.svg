<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ERP4U project artwork</title>
  <desc id="desc">A polished enterprise dashboard concept with business metrics, a revenue chart, inventory status and recent orders.</desc>
  <defs>
