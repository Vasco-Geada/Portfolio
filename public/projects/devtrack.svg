<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">DevTrack project artwork</title>
  <desc id="desc">A conceptual software project board with tasks, status columns and connected Git branches.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1490" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A32"/>
      <stop offset="0.56" stop-color="#0C2C52"/>
      <stop offset="1" stop-color="#13568A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020817" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#93C5FD" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="34" fill="url(#grid)"/>
  <circle cx="1440" cy="30" r="330" fill="#38BDF8" fill-opacity="0.09"/>
  <circle cx="80" cy="870" r="300" fill="#2563EB" fill-opacity="0.13"/>

  <g transform="translate(108 95)">
    <rect width="60" height="60" rx="18" fill="url(#accent)"/>
    <path d="M18 20H35C43 20 47 25 47 31C47 38 42 42 35 42H18V20ZM26 27V35H34C37 35 39 34 39 31C39 28 37 27 34 27H26Z" fill="#06172D"/>
    <text x="83" y="39" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760" letter-spacing="-1.2">DevTrack</text>
    <text x="84" y="66" fill="#93C5FD" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">SOFTWARE PROJECT MANAGEMENT</text>
  </g>

  <g transform="translate(110 220)" filter="url(#shadow)">
    <rect width="1380" height="560" rx="30" fill="#F8FAFC"/>
    <rect width="1380" height="76" rx="30" fill="#EAF2FC"/>
    <path d="M0 76H1380" stroke="#CBDCEC"/>
    <circle cx="42" cy="38" r="8" fill="#FB7185"/>
    <circle cx="68" cy="38" r="8" fill="#FBBF24"/>
    <circle cx="94" cy="38" r="8" fill="#34D399"/>
    <text x="134" y="45" fill="#173B62" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Project / Portfolio Platform</text>
    <rect x="1140" y="20" width="202" height="38" rx="12" fill="#DCEBFA"/>
    <circle cx="1166" cy="39" r="9" fill="#2563EB"/>
    <text x="1186" y="45" fill="#31577A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Java · In progress</text>

    <g transform="translate(36 110)">
      <g>
        <text x="0" y="20" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750" letter-spacing="1.5">BACKLOG</text>
        <text x="324" y="20" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750" letter-spacing="1.5">IN PROGRESS</text>
        <text x="648" y="20" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750" letter-spacing="1.5">REVIEW</text>
        <text x="972" y="20" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750" letter-spacing="1.5">DONE</text>
      </g>

      <g fill="#E8EEF5">
        <rect y="44" width="284" height="372" rx="20"/>
        <rect x="324" y="44" width="284" height="372" rx="20"/>
        <rect x="648" y="44" width="284" height="372" rx="20"/>
        <rect x="972" y="44" width="284" height="372" rx="20"/>
      </g>

