          <text x="17" y="68" fill="#173B62" font-size="15" font-weight="700">Define project rules</text>
          <text x="17" y="94" fill="#71869A" font-size="12">Assignments and statuses</text>
          <circle cx="220" cy="102" r="11" fill="#BFDBFE"/>
        </g>
        <g transform="translate(342 65)">
          <rect width="248" height="154" rx="15" fill="#FFFFFF"/>
          <rect x="17" y="17" width="66" height="23" rx="11" fill="#CFFAFE"/>
          <text x="31" y="33" fill="#0891B2" font-size="11" font-weight="750">TASK</text>
          <text x="17" y="68" fill="#173B62" font-size="15" font-weight="700">Task type hierarchy</text>
          <text x="17" y="94" fill="#71869A" font-size="12">Inheritance · Polymorphism</text>
          <rect x="17" y="118" width="154" height="7" rx="3.5" fill="#DCE7F1"/>
          <rect x="17" y="118" width="104" height="7" rx="3.5" fill="url(#accent)"/>
        </g>
        <g transform="translate(666 65)">
          <rect width="248" height="126" rx="15" fill="#FFFFFF"/>
          <rect x="17" y="17" width="72" height="23" rx="11" fill="#EDE9FE"/>
          <text x="30" y="33" fill="#7C3AED" font-size="11" font-weight="750">REVIEW</text>
          <text x="17" y="68" fill="#173B62" font-size="15" font-weight="700">Validate transitions</text>
          <text x="17" y="94" fill="#71869A" font-size="12">Domain rules and states</text>
        </g>
        <g transform="translate(990 65)">
          <rect width="248" height="126" rx="15" fill="#FFFFFF"/>
          <rect x="17" y="17" width="66" height="23" rx="11" fill="#D1FAE5"/>
          <text x="31" y="33" fill="#059669" font-size="11" font-weight="750">DONE</text>
          <text x="17" y="68" fill="#173B62" font-size="15" font-weight="700">Project domain</text>
          <text x="17" y="94" fill="#71869A" font-size="12">Java model established</text>
        </g>
