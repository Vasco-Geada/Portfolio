        <g fill="#FFFFFF" stroke="#3B82F6" stroke-width="6">
          <circle cx="0" cy="20" r="11"/><circle cx="190" cy="-40" r="11"/><circle cx="302" cy="-40" r="11"/><circle cx="492" cy="20" r="11"/><circle cx="692" cy="70" r="11"/><circle cx="766" cy="20" r="11"/><circle cx="956" cy="20" r="11"/>
        </g>
