      <g transform="translate(92 333)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 20H116C154 20 149-40 190-40H302C340-40 333 20 376 20H492C532 20 526 70 568 70H692C734 70 724 20 766 20H956" stroke="#94A3B8" stroke-width="5"/>
