      <g font-family="Inter, Arial, sans-serif">
        <rect x="19" y="16" width="74" height="23" rx="11" fill="#5A7ED8" fill-opacity="0.17"/><text x="34" y="31" fill="#91AEF3" font-size="9" font-weight="750">SYSTEM</text>
        <text x="111" y="33" fill="#D9E5F7" font-size="12" font-weight="650">IAbility.execute(target)</text>
        <text x="19" y="60" fill="#7F96B7" font-size="11">Polymorphism keeps every move replaceable and testable.</text>
