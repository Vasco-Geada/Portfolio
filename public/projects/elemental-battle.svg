    <path d="M442 390C461 415 475 431 469 458C464 483 446 496 427 486C405 475 407 451 417 432C427 414 435 402 442 390Z" fill="#FFE985"/>
    <path d="M400 374C390 404 371 418 361 447" stroke="#FFD278" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g filter="url(#glowWater)">
