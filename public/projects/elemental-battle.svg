      <circle cx="42" cy="40" r="23" fill="#7897C2" fill-opacity="0.14"/>
      <circle cx="42" cy="40" r="10" stroke="#9EB6D8" stroke-width="2"/>
      <path d="M42 25V30M42 50V55M27 40H32M52 40H57" stroke="#9EB6D8" stroke-width="2" stroke-linecap="round"/>
