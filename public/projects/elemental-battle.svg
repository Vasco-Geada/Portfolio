    <text x="1" y="58" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="760">03</text>
    <rect x="76" y="3" width="190" height="46" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#BFD6FF" stroke-opacity="0.13"/>
