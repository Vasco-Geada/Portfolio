<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Elemental Battle project artwork</title>
  <desc id="desc">A refined turn-based game interface showing fire and water opponents, health status and object-oriented system concepts.</desc>
  <defs>
    <linearGradient id="background" x1="132" y1="24" x2="1472" y2="876" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10182C"/>
      <stop offset="0.52" stop-color="#172542"/>
      <stop offset="1" stop-color="#0D1D37"/>
    </linearGradient>
    <radialGradient id="fireAura" cx="0" cy="0" r="1" gradientTransform="translate(463 418) rotate(90) scale(260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8A4C" stop-opacity="0.45"/>
      <stop offset="0.58" stop-color="#E94C55" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E94C55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="waterAura" cx="0" cy="0" r="1" gradientTransform="translate(1137 418) rotate(90) scale(260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#53C9FF" stop-opacity="0.45"/>
      <stop offset="0.58" stop-color="#386AFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#386AFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="367" y1="302" x2="540" y2="548" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE071"/>
      <stop offset="0.48" stop-color="#FF7B45"/>
      <stop offset="1" stop-color="#E93C4F"/>
    </linearGradient>
    <linearGradient id="water" x1="1060" y1="291" x2="1216" y2="563" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8DEBFF"/>
      <stop offset="0.48" stop-color="#3AA4F3"/>
      <stop offset="1" stop-color="#435CE8"/>
    </linearGradient>
    <linearGradient id="arena" x1="800" y1="420" x2="800" y2="748" gradientUnits="userSpaceOnUse">
      <stop stop-color="#324263" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#10192D" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="stars" width="94" height="94" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1.2" fill="#B8D4FF" fill-opacity="0.24"/>
      <circle cx="67" cy="44" r="1" fill="#B8D4FF" fill-opacity="0.16"/>
    </pattern>
    <filter id="glowFire" x="274" y="226" width="378" height="424" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur"/>
    </filter>
    <filter id="glowWater" x="945" y="225" width="382" height="427" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur"/>
    </filter>
    <filter id="panelShadow" x="49" y="15" width="1502" height="862" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#020713" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#background)"/>
  <rect width="1600" height="900" rx="34" fill="url(#stars)"/>
  <ellipse cx="463" cy="418" rx="300" ry="290" fill="url(#fireAura)"/>
  <ellipse cx="1137" cy="418" rx="300" ry="290" fill="url(#waterAura)"/>
